<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Courbes des taux · swaps, OAT, Bund, Treasuries</title>
<meta name="description" content="Simulateur de courbes des taux : swaps EUR et USD, OAT, Bund, Treasuries, taux bancaires sur 12 mois, simulation d'emprunt.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f1ea}
#app{overflow-x:clip}
a{color:#b05a2e;text-decoration:none}a:hover{color:#8a4422;text-decoration:underline;text-underline-offset:2px}
button{cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #b05a2e;outline-offset:2px}
input[type=range]{accent-color:#062f59}
noscript{display:block;padding:40px;font-family:Arial,Helvetica,sans-serif;color:#062f59}
</style>
</head>
<body>
<div id="app"></div>
<noscript>Cette page nécessite JavaScript.</noscript>
<template id="tpl">
<div style="min-height: 100vh; background: #f4f1ea; color: #4a5668; font-family: Calibri, Carlito, 'Segoe UI', sans-serif; font-size: 15px; line-height: 1.55; padding: 32px 20px 48px; box-sizing: border-box">
<div style="max-width: 1120px; margin: 0 auto; background: #fbf9f5; border: 1px solid #e4ded3">

<header style="background: #062f59; color: #ffffff; padding: 0 40px; display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap">
<div style="display: flex; align-items: center; gap: 26px; flex-wrap: wrap">
<div style="font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.32em; white-space: nowrap; padding: 16px 0">COURBES DES TAUX</div>
<div role="tablist" aria-label="Sections" style="display: flex; flex-wrap: wrap">
<sc-for list="{{tabs}}" as="tb" hint-placeholder-count="5">
<button type="button" role="tab" aria-selected="{{tb.on}}" onClick="{{tb.pick}}" style="min-height: 48px; border: 0; background: {{tb.bg}}; color: {{tb.fg}}; font-family: Arial, Helvetica, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; padding: 17px 14px">{{tb.label}}</button>
</sc-for>
</div>
</div>
<div style="display: flex; align-items: center; gap: 18px; flex-wrap: wrap"><div style="font-family: Arial, Helvetica, sans-serif; font-size: 10.5px; letter-spacing: 0.18em; color: #9db6d2; white-space: nowrap; padding: 16px 0">{{asOfLabel}}</div><a href="https://nickel.siftlab.net/" style="font-family: Arial, Helvetica, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #ffffff; white-space: nowrap; padding: 16px 0; text-decoration: none">Nickel ↗</a></div>
</header>

<sc-if value="{{isSim}}" hint-placeholder-val="{{ true }}">
<div role="tabpanel" aria-label="Simulateur">
<div style="padding: 36px 40px 28px; border-bottom: 1px solid #e4ded3">
<div style="font-family: Arial, Helvetica, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #b05a2e; margin-bottom: 12px">Simulateur de courbes</div>
<h1 style="margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 400; letter-spacing: -0.02em; color: #062f59; line-height: 1.15">Swaps, OAT, Bund et Treasuries sur une même échelle</h1>
<p style="margin: 10px 0 0; max-width: 80ch">Choisissez une date, superposez une référence, puis appliquez un choc de taux. Les points pleins sont observés ; les points creux et les segments pointillés sont estimés.</p>
<div style="font-family: Arial, Helvetica, sans-serif; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #66707f; margin-top: 18px">Fins de mois oct. 2025 → sept. 2026 · dernier point 23.10.2026 · Treasuries 26.10.2026</div>
</div>

<section aria-label="Paramètres d'affichage" style="padding: 22px 40px 24px; border-bottom: 1px solid #e4ded3; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px">
<span style="width: 96px; font-family: Arial, Helvetica, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #062f59">Date</span>
<button type="button" onClick="{{togglePlay}}" style="min-height: 44px; padding: 8px 16px; border: 1px solid #b05a2e; background: #b05a2e; color: #ffffff; font-family: Arial, Helvetica, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase">{{playText}}</button>
<div style="display: inline-flex; flex-wrap: wrap; gap: 1px; background: #e4ded3; border: 1px solid #e4ded3; max-width: 100%">
<sc-for list="{{months}}" as="m" hint-placeholder-count="13">
<button type="button" onClick="{{m.pick}}" aria-pressed="{{m.on}}" style="min-height: 44px; padding: 8px 11px; border: 0; background: {{m.bg}}; color: {{m.fg}}; font-family: Arial, Helvetica, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase">{{m.label}}</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px">
<span style="width: 96px; font-family: Arial, Helvetica, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #062f59">Courbes</span>
<div style="display: inline-flex; flex-wrap: wrap; gap: 1px; background: #e4ded3; border: 1px solid #e4ded3; max-width: 100%">
<sc-for list="{{serBtns}}" as="s" hint-placeholder-count="5">
<button type="button" onClick="{{s.toggle}}" aria-pressed="{{s.on}}" style="min-height: 44px; padding: 8px 14px; border: 0; background: {{s.bg}}; color: #062f59; font-family: Arial, Helvetica, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 8px; opacity: {{s.op}}"><svg width="18" height="6" viewBox="0 0 18 6" aria-hidden="true"><path d="M1 3 H17" style="stroke: {{s.color}}; stroke-width: 3"></path></svg>{{s.name}}</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px">
<span style="width: 96px; font-family: Arial, Helvetica, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #062f59">Comparer à</span>
<div style="display: inline-flex; flex-wrap: wrap; gap: 1px; background: #e4ded3; border: 1px solid #e4ded3; max-width: 100%">
<sc-for list="{{cmpBtns}}" as="c" hint-placeholder-count="3">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="min-height: 44px; padding: 8px 14px; border: 0; background: {{c.bg}}; color: {{c.fg}}; font-family: Arial, Helvetica, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase">{{c.label}}</button>
</sc-for>
</div>
</div>
</section>

<div style="display: flex; flex-wrap: wrap; border-bottom: 1px solid #e4ded3">
<section aria-label="Graphique des courbes" style="flex: 999 1 600px; min-width: 0; padding: 28px 32px 30px 40px; border-right: 1px solid #e4ded3; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap">
<h2 style="margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #062f59">Courbes au {{dateLong}}</h2>
<span style="font-family: Arial, Helvetica, sans-serif; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #66707f">% · maturités en racine carrée</span>
</div>
<div style="display: flex; gap: 6px 18px; flex-wrap: wrap; font-family: Arial, Helvetica, sans-serif; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #66707f">
<span>Plein : date affichée</span>
<span>Pâle : {{ghostLegend}}</span>
<span>Pointillé fin : estimé</span>
<span>Tirets : choc</span>
<span>Losanges : €STR, EFFR</span>
</div>
<div role="img" aria-label="{{chartAria}}" onMouseMove="{{onMove}}" onMouseLeave="{{onLeave}}" style="position: relative; width: 100%; aspect-ratio: 1000 / 520">
<svg viewBox="0 0 1000 520" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible">
<path d="{{g.vgrid}}" style="fill: none; stroke: #f0ece4; stroke-width: 1; vector-effect: non-scaling-stroke"></path>
<path d="{{g.grid}}" style="fill: none; stroke: #e4ded3; stroke-width: 1; vector-effect: non-scaling-stroke"></path>
<path d="{{g.axis}}" style="fill: none; stroke: #cfc8bb; stroke-width: 1; vector-effect: non-scaling-stroke"></path>
<path d="{{g.cross}}" style="fill: none; stroke: #062f59; stroke-width: 1; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke"></path>
<path d="{{p.bund.ghost}}" style="fill: none; stroke: #062f59; stroke-width: 2; opacity: 0.25; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke"></path>
<path d="{{p.sweur.ghost}}" style="fill: none; stroke: #9db6d2; stroke-width: 2; opacity: 0.45; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke"></path>
<path d="{{p.oat.ghost}}" style="fill: none; stroke: #b05a2e; stroke-width: 2; opacity: 0.3; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke"></path>
<path d="{{p.ust.ghost}}" style="fill: none; stroke: #4a5668; stroke-width: 2; opacity: 0.3; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke"></path>
<path d="{{p.swusd.ghost}}" style="fill: none; stroke: #e9a47c; stroke-width: 2; opacity: 0.45; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke"></path>
<path d="{{p.bund.obs}}" style="fill: none; stroke: #062f59; stroke-width: 2.25; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke"></path>
<path d="{{p.sweur.obs}}" style="fill: none; stroke: #9db6d2; stroke-width: 2.75; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke"></path>
<path d="{{p.oat.obs}}" style="fill: none; stroke: #b05a2e; stroke-width: 2.25; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke"></path>
<path d="{{p.ust.obs}}" style="fill: none; stroke: #4a5668; stroke-width: 2.25; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke"></path>
<path d="{{p.swusd.obs}}" style="fill: none; stroke: #e9a47c; stroke-width: 2.75; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke"></path>
<path d="{{p.sweur.est}}" style="fill: none; stroke: #9db6d2; stroke-width: 2.75; stroke-dasharray: 1 5; stroke-linecap: round; vector-effect: non-scaling-stroke"></path>
<path d="{{p.swusd.est}}" style="fill: none; stroke: #e9a47c; stroke-width: 2.75; stroke-dasharray: 1 5; stroke-linecap: round; vector-effect: non-scaling-stroke"></path>
<path d="{{p.bund.shock}}" style="fill: none; stroke: #062f59; stroke-width: 2; stroke-dasharray: 8 5; vector-effect: non-scaling-stroke"></path>
<path d="{{p.sweur.shock}}" style="fill: none; stroke: #7f9bbd; stroke-width: 2; stroke-dasharray: 8 5; vector-effect: non-scaling-stroke"></path>
<path d="{{p.oat.shock}}" style="fill: none; stroke: #b05a2e; stroke-width: 2; stroke-dasharray: 8 5; vector-effect: non-scaling-stroke"></path>
<path d="{{p.ust.shock}}" style="fill: none; stroke: #4a5668; stroke-width: 2; stroke-dasharray: 8 5; vector-effect: non-scaling-stroke"></path>
<path d="{{p.swusd.shock}}" style="fill: none; stroke: #d98a5c; stroke-width: 2; stroke-dasharray: 8 5; vector-effect: non-scaling-stroke"></path>
<path d="{{p.bund.mo}}" style="fill: #062f59; stroke: #fbf9f5; stroke-width: 1.5"></path>
<path d="{{p.sweur.mo}}" style="fill: #9db6d2; stroke: #fbf9f5; stroke-width: 1.5"></path>
<path d="{{p.oat.mo}}" style="fill: #b05a2e; stroke: #fbf9f5; stroke-width: 1.5"></path>
<path d="{{p.ust.mo}}" style="fill: #4a5668; stroke: #fbf9f5; stroke-width: 1.5"></path>
<path d="{{p.swusd.mo}}" style="fill: #e9a47c; stroke: #fbf9f5; stroke-width: 1.5"></path>
<path d="{{p.sweur.me}}" style="fill: #fbf9f5; stroke: #7f9bbd; stroke-width: 2"></path>
<path d="{{p.swusd.me}}" style="fill: #fbf9f5; stroke: #d98a5c; stroke-width: 2"></path>
<path d="{{g.anch}}" style="fill: #062f59; stroke: #fbf9f5; stroke-width: 1.5"></path>
<path d="{{g.anchShock}}" style="fill: none; stroke: #062f59; stroke-width: 1.5"></path>
</svg>
<sc-for list="{{yTicks}}" as="t" hint-placeholder-count="10">
<div style="position: absolute; left: 0; width: 6.2%; top: {{t.top}}; transform: translateY(-50%); text-align: right; font-family: Arial, Helvetica, sans-serif; font-size: 10px; color: #66707f">{{t.txt}}</div>
</sc-for>
<sc-for list="{{xTicks}}" as="t" hint-placeholder-count="8">
<div style="position: absolute; top: 92.5%; left: {{t.left}}; transform: translateX(-50%); font-family: Arial, Helvetica, sans-serif; font-size: 10px; color: #66707f">{{t.txt}}</div>
</sc-for>
<sc-for list="{{anchLabels}}" as="a" hint-placeholder-count="2">
<div style="position: absolute; left: 8.4%; top: {{a.top}}; transform: translateY(-50%); font-family: Arial, Helvetica, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; color: #062f59; background: rgba(251,249,245,0.9); padding: 0 3px; white-space: nowrap">{{a.txt}}</div>
</sc-for>
<sc-for list="{{endLabels}}" as="l" hint-placeholder-count="5">
<div style="position: absolute; left: 87.4%; top: {{l.top}}; transform: translateY(-50%); display: flex; align-items: center; gap: 6px; font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: 700; color: #062f59; white-space: nowrap"><span style="width: 14px; height: 3px; background: {{l.color}}"></span>{{l.txt}}</div>
</sc-for>
<sc-if value="{{tip.show}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; top: 2%; left: {{tip.left}}; right: {{tip.right}}; min-width: 220px; background: #062f59; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; font-size: 13px; color: #ffffff">
<div style="font-family: Arial, Helvetica, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #9db6d2">{{tip.title}}</div>
<sc-for list="{{tip.rows}}" as="r" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 10px; justify-content: space-between">
<span style="display: inline-flex; align-items: center; gap: 6px; color: #dfe7f0"><span style="width: 14px; height: 3px; background: {{r.color}}"></span>{{r.name}}</span>
<span style="font-family: Arial, Helvetica, sans-serif; font-weight: 700; color: #ffffff; font-variant-numeric: tabular-nums">{{r.val}}<span style="font-weight: 400; color: #e9a47c"> {{r.extra}}</span></span>
</div>
</sc-for>
</div>
</sc-if>
</div>
<sc-if value="{{isLast}}" hint-placeholder-val="{{ true }}">
<p style="margin: 0; font-size: 13px; color: #66707f">Treasuries au 26 oct. 2026 : écart de 2 pb au plus avec le 23 oct. sur 2, 5, 10 et 30 ans.</p>
</sc-if>
</section>

<aside aria-label="Indicateurs" style="flex: 1 1 300px; min-width: 0; padding: 28px 40px 30px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #062f59">Indicateurs</h2>
<span style="font-size: 13px; color: #66707f">Au {{dateLong}}, écarts {{refPhrase}}</span>
</div>
<sc-for list="{{kpiGroups}}" as="kg" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 8px">
<h3 style="margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 9.5px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #b05a2e">{{kg.title}}</h3>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: #e4ded3; border: 1px solid #e4ded3">
<sc-for list="{{kg.items}}" as="k" hint-placeholder-count="4">
<div style="background: #fbf9f5; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-family: Arial, Helvetica, sans-serif; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: #66707f; line-height: 1.4">{{k.label}}</span>
<span style="font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: #062f59; margin-top: 4px; font-variant-numeric: tabular-nums">{{k.val}}</span>
<span style="font-size: 12.5px; color: #66707f; line-height: 1.35">{{k.delta}}</span>
</div>
</sc-for>
</div>
</div>
</sc-for>
<div style="display: flex; flex-direction: column; gap: 14px">
<h3 style="margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 9.5px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #b05a2e">Régime de déformation {{refPhrase}}</h3>
<sc-for list="{{regimes}}" as="r" hint-placeholder-count="5">
<div style="border-left: 2px solid {{r.color}}; padding-left: 14px; display: flex; flex-direction: column; gap: 2px">
<span style="font-family: Arial, Helvetica, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #b05a2e">{{r.name}} · {{r.label}}</span>
<span style="font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; color: #062f59; font-variant-numeric: tabular-nums">2A {{r.d2}} · 10A {{r.d10}} · 30A {{r.d30}}</span>
<span style="font-size: 13px; color: #4a5668; line-height: 1.4">{{r.text}}</span>
</div>
</sc-for>
</div>
</aside>
</div>

<section aria-label="Valeurs à la date affichée" style="padding: 28px 40px 32px; border-bottom: 1px solid #e4ded3; overflow-x: auto">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 14px">
<h2 style="margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #062f59">Valeurs au {{dateLong}}</h2>
<span style="font-family: Arial, Helvetica, sans-serif; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #66707f">% · italique : estimé</span>
</div>
<div role="table" aria-label="Valeurs à la date affichée" style="min-width: 820px; display: flex; flex-direction: column; font-size: 14px; font-variant-numeric: tabular-nums">
<div role="row" style="display: grid; grid-template-columns: minmax(170px, 1.8fr) repeat(11, minmax(0, 1fr)); border-bottom: 1px solid #062f59">
<div role="columnheader" style="padding: 9px 8px 9px 0; font-family: Arial, Helvetica, sans-serif; font-weight: 700; font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; color: #66707f">Courbe</div>
<sc-for list="{{tenorHeads}}" as="h" hint-placeholder-count="11">
<div role="columnheader" style="padding: 9px 8px; font-family: Arial, Helvetica, sans-serif; font-weight: 700; font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; color: #66707f; text-align: right">{{h}}</div>
</sc-for>
</div>
<sc-for list="{{tbl}}" as="r" hint-placeholder-count="5">
<div role="row" style="display: grid; grid-template-columns: minmax(170px, 1.8fr) repeat(11, minmax(0, 1fr)); border-bottom: 1px solid #ece7dd">
<div role="rowheader" style="padding: 9px 8px 9px 0; display: flex; align-items: center; gap: 8px; color: #062f59"><span style="width: 14px; height: 3px; background: {{r.color}}"></span>{{r.name}}</div>
<sc-for list="{{r.cells}}" as="c" hint-placeholder-count="11">
<div role="cell" style="padding: 9px 8px; text-align: right; color: {{c.col}}; font-style: {{c.fs}}">{{c.txt}}</div>
</sc-for>
</div>
</sc-for>
</div>
<p style="margin: 12px 0 0; font-size: 13px; color: #66707f; max-width: 90ch">Colonne JJ : €STR pour la ligne Swap EUR, Fed funds effectif (EFFR) pour les Treasuries, SOFR pour le Swap USD. Entre 3 mois et 1 an, la ligne Swap EUR reprend l'Euribor du même terme.</p>
</section>

<section aria-label="Simulateur de chocs" style="display: flex; flex-wrap: wrap; border-bottom: 1px solid #e4ded3">
<div style="flex: 1 1 340px; min-width: 0; padding: 28px 28px 32px 40px; border-right: 1px solid #e4ded3; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #062f59">Simulateur de chocs</h2>
<span style="font-size: 14px; color: #66707f">Les chocs s'appliquent à la date affichée. Scénarios prédéfinis : hypothèses de travail illustratives, pas des prévisions.</span>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<span style="font-family: Arial, Helvetica, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #062f59">Zone</span>
<div style="display: inline-flex; flex-wrap: wrap; gap: 1px; background: #e4ded3; border: 1px solid #e4ded3">
<sc-for list="{{zoneBtns}}" as="z" hint-placeholder-count="3">

<div style="border-left: 2px solid #062f59; padding-left: 14px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: Arial, Helvetica, sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #062f59">Fait</span><span style="font-size: 14px">Inversion du cycle : la BCE (+50 pb en juin et septembre) et la Fed (+25 pb en septembre) sont passées de l'assouplissement au resserrement après le choc pétrolier ouvert par la guerre avec l'Iran (28 févr. 2026).</span></div>
<div style="border-left: 2px solid #062f59; padding-left: 14px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: Arial, Helvetica, sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #062f59">Fait</span><span style="font-size: 14px">En zone euro, la hausse est concentrée sur le court terme : Bund 2 ans +105 pb, 10 ans +68 pb, 30 ans +51 pb (zéro-coupon). Aplatissement haussier, typique d'un resserrement anticipé.</span></div>
<div style="border-left: 2px solid #062f59; padding-left: 14px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: Arial, Helvetica, sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #062f59">Fait</span><span style="font-size: 14px">L'OAT 10 ans a pris 163 pb et l'écart avec le Bund est passé de 78 à 171 pb, l'essentiel depuis la mi-septembre. Depuis le 30 sept., le Bund recule de 25 pb pendant que l'OAT monte de 30 pb : un choc de spread, pas de taux sans risque.</span></div>
<div style="border-left: 2px solid #062f59; padding-left: 14px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: Arial, Helvetica, sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #062f59">Fait</span><span style="font-size: 14px">Aux États-Unis, le 10 ans a clôturé à 5,31 % le 5 oct. (5,36 % en séance le 7 oct., plus haut depuis 2002 selon la presse) avant de revenir à 5,00 %. Pente 2-10 ans : de 51 à 32 pb.</span></div>
<div style="border-left: 2px solid #b05a2e; padding-left: 14px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: Arial, Helvetica, sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #b05a2e">Inférence</span><span style="font-size: 14px">Les crédits nouveaux aux entreprises (+21 pb d'oct. 2025 à août 2026) n'ont absorbé qu'une faible part de la hausse du swap 5 ans (environ +90 pb, estimé) : transmission différée ou compression des marges ; rattrapage probable si les taux de marché restent à ce niveau.</span></div>
</section>
</div>

    return t + 'A';
  }

  pts(k, i) {
    const d = this.D();
    if (k === 'bund') return d.deT.map((t, j) => ({ t: t, v: d.de[i][j], e: false }));
    if (k === 'oat') return d.frT.map((t, j) => ({ t: t, v: d.fr[i][j], e: false }));
    if (k === 'ust') return d.ustT.map((t, j) => ({ t: t, v: d.ust[i][j], e: false }));
    if (k === 'sweur') {
      const mm = [{ t: 0.25, v: d.e3m[i], e: false }, { t: 0.5, v: d.e6m[i], e: false }, { t: 1, v: d.e12m[i], e: false }];
      return mm.concat(d.swT.map((t, j) => ({ t: t, v: d.swe[i][j], e: d.swef[i][j] === 'e' })));
    }
    return d.swT.map((t, j) => ({ t: t, v: d.swu[i][j], e: d.swuf[i][j] === 'e' }));
  }
  at(k, i, t) {
    const p = this.pts(k, i).find(q => q.t === t);
    return p || null;
  }

  inZone(z) { const s = this.state.zone; return s === 'both' || s === z; }
  oatW(t, i) {
    const d = this.D();
    const tt = t < 2 ? 2 : t;
    const j = d.deT.indexOf(tt);
    if (j < 0) return 1;
    const s = d.fr[i][d.frT.indexOf(tt)] - d.de[i][j];
    const s10 = d.fr[i][3] - d.de[i][2];
    if (s10 <= 0) return 1;
    return Math.max(0, Math.min(2, s / s10));
  }
  shockBp(k, t, i) {
    const s = this.state;
    const z = k === 'ust' || k === 'swusd' ? 'usd' : 'eur';
    if (!this.inZone(z)) return 0;
    if (t === 0) return s.P;
    const lp = Math.exp(-t / 3);
    const ls = (Math.log(Math.max(t, 2)) - Math.log(5)) / Math.log(15);
    const lc = Math.exp(-Math.pow(Math.log(t / 5), 2) / (2 * 0.36));
    let d = s.P * lp + s.L + s.S * ls + s.C * lc;
    if (k === 'oat') d += s.X * this.oatW(t, i);
    return d;
  }
  shockOn() { const s = this.state; return s.P !== 0 || s.L !== 0 || s.S !== 0 || s.C !== 0 || s.X !== 0; }

  X(t) { return 72 + 788 * Math.sqrt(t / 30); }
  Y(v) { return 468 - (v - this._ymin) / (this._ymax - this._ymin) * 444; }
  lineD(P) { return P.map((p, ix) => (ix ? 'L' : 'M') + this.X(p.t).toFixed(1) + ' ' + this.Y(p.v).toFixed(1)).join(' '); }
  segD(P, est) {
    let out = '';
    for (let k = 1; k < P.length; k++) {
      const a = P[k - 1], b = P[k];
      if ((a.e || b.e) !== est) continue;
      out += 'M' + this.X(a.t).toFixed(1) + ' ' + this.Y(a.v).toFixed(1) + ' L' + this.X(b.t).toFixed(1) + ' ' + this.Y(b.v).toFixed(1) + ' ';
    }
    return out;
  }
  circ(P, est, r) {
    return P.filter(p => !!p.e === est).map(p => {
      const x = this.X(p.t), y = this.Y(p.v);
      return 'M' + (x - r).toFixed(1) + ' ' + y.toFixed(1) + ' a' + r + ' ' + r + ' 0 1 0 ' + (2 * r) + ' 0 a' + r + ' ' + r + ' 0 1 0 ' + (-2 * r) + ' 0 Z';
    }).join(' ');
  }
  diamond(x, y, r) {
    return 'M' + x.toFixed(1) + ' ' + (y - r).toFixed(1) + ' L' + (x + r).toFixed(1) + ' ' + y.toFixed(1) + ' L' + x.toFixed(1) + ' ' + (y + r).toFixed(1) + ' L' + (x - r).toFixed(1) + ' ' + y.toFixed(1) + ' Z';
  }

  regime(d2, d10) {
    if (d2 == null || d10 == null) return { l: 'n.d.', t: '' };
    const sl = d10 - d2, av = (d2 + d10) / 2;
    if (Math.abs(d2) < 5 && Math.abs(d10) < 5) return { l: 'Stable', t: 'Variations inférieures à 5 pb sur 2 et 10 ans.' };
    if (d2 * d10 < 0 && Math.abs(d2) >= 5 && Math.abs(d10) >= 5) return sl > 0 ? { l: 'Twist pentifiant', t: 'Court terme en baisse, long terme en hausse.' } : { l: 'Twist aplatissant', t: 'Court terme en hausse, long terme en baisse.' };
    if (Math.abs(sl) < 8) return av > 0 ? { l: 'Hausse parallèle', t: 'Translation vers le haut, pente 2-10 ans quasi inchangée.' } : { l: 'Baisse parallèle', t: 'Translation vers le bas, pente 2-10 ans quasi inchangée.' };
    if (av > 0) return sl < 0 ? { l: 'Bear flattening', t: 'Hausse menée par le court terme : resserrement monétaire anticipé.' } : { l: 'Bear steepening', t: 'Hausse menée par le long terme : prime de terme, inflation, offre de titres.' };
    return sl > 0 ? { l: 'Bull steepening', t: 'Baisse menée par le court terme : assouplissement monétaire anticipé.' } : { l: 'Bull flattening', t: 'Baisse menée par le long terme : fuite vers la qualité, ralentissement anticipé.' };
  }

    return on ? { bg: '#062f59', fg: '#ffffff', bd: '#062f59', fw: '700' } : { bg: '#fbf9f5', fg: '#4a5668', bd: '#e4ded3', fw: '700' };

  // ---------- Historique ----------
  hbuild(def, h, handlers) {
    const d = this.D();

    const all = [];
    def.series.forEach(s => {
      if (s.vals) s.vals.forEach(v => { if (v != null) all.push(v); });

    });
    const mn = Math.min.apply(null, all), mx = Math.max.apply(null, all);
    const span = mx - mn;
    let step;

    else step = span <= 1.2 ? 0.25 : span <= 3 ? 0.5 : 1;

    let ymax = Math.ceil(mx / step) * step;

    let grid = '';

    }

        const last = s.step[s.step.length - 1][2];

        let val;

      } else {
        const days = s.days || d.days;
        const P = [];
        s.vals.forEach((v, k) => { if (v != null) P.push({ k: k, x: X(days[k]), y: Y(v), v: v, e: !!(s.flags && s.flags[k] === 'e') }); });
        for (let k = 1; k < P.length; k++) {
          const a = P[k - 1], b = P[k];
          const seg = 'M' + a.x.toFixed(1) + ' ' + a.y.toFixed(1) + ' L' + b.x.toFixed(1) + ' ' + b.y.toFixed(1) + ' ';
          if (a.e || b.e) o.est += seg; else o.obs += seg;
        }
        const r = 3.2;
        P.forEach(p => {
          const c = 'M' + (p.x - r).toFixed(1) + ' ' + p.y.toFixed(1) + ' a' + r + ' ' + r + ' 0 1 0 ' + (2 * r) + ' 0 a' + r + ' ' + r + ' 0 1 0 ' + (-2 * r) + ' 0 Z ';
          if (p.e) o.me += c; else o.mo += c;

        ends.push({ y: lastP.y, txt: s.short + ' ' + fmt(lastP.v) + (lastP.e ? ' e' : ''), color: s.color });
        if (h == null) {

        } else {
          const v = s.vals[h];

        }
      }
      slots.push(o);
    });
    while (slots.length < 5) slots.push({ obs: '', est: '', mo: '', me: '', color: '#fbf9f5', w: '0' });
    ends.sort((a, b) => a.y - b.y);
    for (let k = 1; k < ends.length; k++) if (ends[k].y < ends[k - 1].y + 15) ends[k].y = ends[k - 1].y + 15;
    const over = ends.length ? ends[ends.length - 1].y - 278 : 0;
    if (over > 0) ends.forEach(e => { e.y -= over; });

  mini(curves) {

    const all = [];
    curves.forEach(c => { c.b.forEach(v => all.push(v)); c.a.forEach(v => all.push(v)); });
    const mn = Math.floor((Math.min.apply(null, all) - 0.05) * 4) / 4;
    const mx = Math.ceil((Math.max.apply(null, all) + 0.05) * 4) / 4;
    const Y = v => H1 - (v - mn) / (mx - mn) * (H1 - H0);
    const line = (T, V) => T.map((t, k) => (k ? 'L' : 'M') + X(t).toFixed(1) + ' ' + Y(V[k]).toFixed(1)).join(' ');
    const dots = (T, V) => T.map((t, k) => { const x = X(t), y = Y(V[k]), r = 2.8; return 'M' + (x - r).toFixed(1) + ' ' + y.toFixed(1) + ' a' + r + ' ' + r + ' 0 1 0 ' + (2 * r) + ' 0 a' + r + ' ' + r + ' 0 1 0 ' + (-2 * r) + ' 0 Z'; }).join(' ');
    const out = { b1: '', a1: '', m1: '', b2: '', a2: '', m2: '', c1: '#fbf9f5', c2: '#fbf9f5' };
    curves.forEach((c, k) => {
      out['b' + (k + 1)] = line(c.t, c.b);
      out['a' + (k + 1)] = line(c.t, c.a);
      out['m' + (k + 1)] = dots(c.t, c.a);
      out['c' + (k + 1)] = c.color;

    out.grid = 'M' + W0 + ' ' + H0 + ' H' + W1 + ' M' + W0 + ' ' + H1 + ' H' + W1;
    out.yl = [{ top: (H0 / 1.4).toFixed(1) + '%', txt: this.f2(mx) }, { top: (H1 / 1.4).toFixed(1) + '%', txt: this.f2(mn) }];
    out.xl = [2, 10, 30].map(t => ({ left: (X(t) / 2.4).toFixed(1) + '%', txt: t + 'A' }));
    return out;
  }

    }, [{ t: d.deT, b: d.de[11], a: d.de[12], color: B }, { t: d.frT, b: d.fr[11], a: d.fr[12], color: O }]));

    });

    spr.aria = 'Écart OAT moins Bund par maturité 2, 5, 10, 30 ans : ' + S.map(s => s.name + ' ' + s.v.map(v => Math.round(v)).join(', ')).join(' ; ');

  // ---------- Simulateur ----------
  simVals() {
    const d = this.D();
    const st = this.state;
    const i = st.di;
    const SER = this.ser();
    const HT = [0, 0.25, 0.5, 1, 2, 3, 5, 7, 10, 20, 30];
    const ref = st.cmp === 'y' ? 0 : st.cmp === 'm' ? (i > 0 ? i - 1 : null) : null;
    const kref = st.cmp === 'none' ? 0 : ref;
    const shockOn = this.shockOn();
    const vis = SER.filter(s => st.vis[s.k]);

    const vals = [2, 5.5];
    vis.forEach(s => {
      this.pts(s.k, i).forEach(p => { vals.push(p.v); if (shockOn) vals.push(p.v + this.shockBp(s.k, p.t, i) / 100); });
      if (ref != null) this.pts(s.k, ref).forEach(p => vals.push(p.v));
    });
    vals.push(d.estr[i], d.effr[i]);
    const mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
    this._ymin = Math.min(1.5, Math.floor((mn - 0.1) * 2) / 2);
    this._ymax = Math.max(6, Math.ceil((mx + 0.1) * 2) / 2);

    let grid = '';
    const yTicks = [];
    for (let v = this._ymin; v <= this._ymax + 1e-9; v += 0.5) {
      const y = this.Y(v);
      grid += 'M72 ' + y.toFixed(1) + ' H860 ';
      yTicks.push({ top: (y / 5.2).toFixed(2) + '%', txt: v.toFixed(1).replace('.', ',') });
    }
    const tickT = [0, 0.25, 1, 2, 5, 10, 20, 30];
    let vgrid = '';
    const xTicks = tickT.map(t => { const x = this.X(t); vgrid += 'M' + x.toFixed(1) + ' 24 V468 '; return { left: (x / 10).toFixed(2) + '%', txt: this.tenorName(t) }; });
    const axis = 'M72 468 H860 M72 24 V468';

    const p = {};
    SER.forEach(s => {
      const on = st.vis[s.k];
      const P = this.pts(s.k, i);
      const o = { ghost: '', obs: '', est: '', shock: '', mo: '', me: '' };
      if (on) {
        o.obs = this.segD(P, false);
        o.est = this.segD(P, true);
        o.mo = this.circ(P, false, 5);
        o.me = this.circ(P, true, 4.5);
        if (ref != null) o.ghost = this.lineD(this.pts(s.k, ref));
        if (shockOn) o.shock = this.lineD(P.map(q => ({ t: q.t, v: q.v + this.shockBp(s.k, q.t, i) / 100 })));
      }
      p[s.k] = o;
    });

    const anchors = [];
    if (st.vis.bund || st.vis.oat || st.vis.sweur) anchors.push({ name: '€STR', v: d.estr[i], k: 'sweur' });
    if (st.vis.ust || st.vis.swusd) anchors.push({ name: 'EFFR', v: d.effr[i], k: 'ust' });
    const anch = anchors.map(a => this.diamond(72, this.Y(a.v), 6)).join(' ');
    const anchShock = shockOn ? anchors.map(a => { const sv = a.v + this.shockBp(a.k, 0, i) / 100; return Math.abs(sv - a.v) > 1e-6 ? this.diamond(72, this.Y(sv), 6) : ''; }).join(' ') : '';
    const anchLabels = anchors.map(a => ({ top: (this.Y(a.v) / 5.2).toFixed(2) + '%', txt: a.name + ' ' + this.f2(a.v) }));

    const ends = vis.map(s => { const P = this.pts(s.k, i); const last = P[P.length - 1]; return { y: this.Y(last.v), txt: s.short + ' ' + this.f2(last.v) + (last.e ? ' e' : ''), color: s.color }; });
    ends.sort((a, b) => a.y - b.y);
    for (let k = 1; k < ends.length; k++) if (ends[k].y < ends[k - 1].y + 20) ends[k].y = ends[k - 1].y + 20;
    const over = ends.length ? ends[ends.length - 1].y - 500 : 0;
    if (over > 0) ends.forEach(e => { e.y -= over; });
    const endLabels = ends.map(e => ({ top: (e.y / 5.2).toFixed(2) + '%', txt: e.txt, color: e.color }));

    let cross = '';
    let tip = { show: false, left: 'auto', right: 'auto', title: '', rows: [] };
    if (st.hover != null) {
      const t = HT[st.hover];
      const x = this.X(t);
      cross = 'M' + x.toFixed(1) + ' 24 V468';
      const rows = [];
      if (t === 0) {
        if (st.vis.bund || st.vis.oat || st.vis.sweur) rows.push({ name: '€STR', color: '#ffffff', val: this.pct(d.estr[i]), extra: kref != null ? this.bp((d.estr[i] - d.estr[kref]) * 100) : '' });
        if (st.vis.ust) rows.push({ name: 'Fed funds effectif', color: '#ffffff', val: this.pct(d.effr[i]), extra: kref != null ? this.bp((d.effr[i] - d.effr[kref]) * 100) : '' });
        if (st.vis.swusd) rows.push({ name: 'SOFR', color: '#ffffff', val: this.pct(d.sofr[i]), extra: kref != null ? this.bp((d.sofr[i] - d.sofr[kref]) * 100) : '' });
      } else {
        vis.forEach(s => {
          const q = this.at(s.k, i, t);
          if (!q) return;
          let extra = '';
          if (shockOn) extra = '→ ' + this.f2(q.v + this.shockBp(s.k, t, i) / 100);
          else if (kref != null) { const r0 = this.at(s.k, kref, t); extra = r0 ? this.bp((q.v - r0.v) * 100) : ''; }

        });

    }

    const xpf = v => (v * 119.33174).toLocaleString('fr-FR', { maximumFractionDigits: 1 });
    const meur = v => v.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const fin = {
      marge: st.marge,
      margeTxt: st.marge + ' pb',
      onMarge: e => this.setState({ marge: Number(e.target.value) }),
      fix: this.pct(shockOn ? fixS : fixB),
      fixDetail: 'Swap 5 ans ' + this.f2(sw5.v) + ' %' + (sw5.e ? ' (estimé)' : '') + (shockOn ? ', base ' + this.pct(fixB) : ''),
      var: this.pct(shockOn ? varS : varB),
      varDetail: 'Euribor 3M ' + this.f2(d.e3m[i]) + ' %' + (shockOn ? ', base ' + this.pct(varB) : ''),
      prime: this.bp(((shockOn ? fixS : fixB) - (shockOn ? varS : varB)) * 100),
      sentence: 'Pour ' + nom + ' M€ (≈ ' + xpf(nom) + ' M XPF), intérêts annuels de ' + meur(nom * (shockOn ? fixS : fixB) / 100) + ' M€ à taux fixe (≈ ' + xpf(nom * (shockOn ? fixS : fixB) / 100) + ' M XPF) contre ' + meur(nom * (shockOn ? varS : varB) / 100) + ' M€ la première année à taux variable' + (shockOn ? ' dans le scénario, contre ' + meur(nom * fixB / 100) + ' M€ à taux fixe sans choc.' : '.')
    };
    const nomBtns = [5, 10, 25, 50].map(n => Object.assign({ label: n + ' M€', on: st.nom === n, pick: () => this.setState({ nom: n }) }, this.chip(st.nom === n)));

    const chartAria = 'Courbes des taux au ' + d.long[i] + ' : ' + vis.map(s => { const q = this.at(s.k, i, 10); return s.short + ' 10 ans ' + (q ? this.pct(q.v) : 'n.d.'); }).join(', ') + '. Le tableau sous le graphique reprend toutes les valeurs.';

    return {
      dateLong: d.long[i],
      isLast: i === 12,
      playText: st.playing ? 'Pause' : 'Lecture',
      togglePlay: () => {
        if (this.state.playing) { this.stopPlay(); this.setState({ playing: false }); return; }
        const start = this.state.di >= 12 ? 0 : this.state.di;
        this.setState({ playing: true, di: start });
        this.stopPlay();
        this._t = setInterval(() => {
          const nx = this.state.di + 1;
          if (nx > 12) { this.stopPlay(); this.setState({ playing: false }); }
          else this.setState({ di: nx });
        }, 900);
      },
      months: months,
      serBtns: serBtns,
      cmpBtns: cmpBtns,
      zoneBtns: zoneBtns,
      ghostLegend: ref != null ? d.lab[ref] : 'aucune',
      g: { grid: grid, vgrid: vgrid, axis: axis, cross: cross, anch: anch, anchShock: anchShock },
      p: p,
      yTicks: yTicks,
      xTicks: xTicks,
      anchLabels: anchLabels,
      endLabels: endLabels,
      tip: tip,
      onMove: e => {
        const r = e.currentTarget.getBoundingClientRect();
        if (!r.width) return;
        const vx = (e.clientX - r.left) / r.width * 1000;
        let best = 0, bd = 1e9;
        HT.forEach((t, ix) => { const dx = Math.abs(this.X(t) - vx); if (dx < bd) { bd = dx; best = ix; } });
        if (best !== this.state.hover) this.setState({ hover: best });
      },
      onLeave: () => { if (this.state.hover != null) this.setState({ hover: null }); },
      chartAria: chartAria,
      tenorHeads: HT.map(t => this.tenorName(t)),
      tbl: tbl,
      kpiGroups: kpiGroups,
      regimes: regimes,
      refPhrase: refPhrase,
      levers: levers,
      presets: presets,
      presetNote: presetNote,
      impact: impact,
      shockSummary: shockSummary,
      fin: fin,
      nomBtns: nomBtns
    };
  }

  renderVals() {
    const st = this.state;
    const TABS = [['sim', 'Simulateur'], ['loan', 'Emprunt'], ['hist', 'Historique'], ['dyn', 'Dynamiques'], ['src', 'Sources']];
    const tabs = TABS.map(t => ({
      label: t[1], on: st.tab === t[0],
      bg: st.tab === t[0] ? '#fbf9f5' : 'transparent',
      fg: st.tab === t[0] ? '#062f59' : '#9db6d2',
      pick: () => { if (t[0] !== 'sim') this.stopPlay(); this.setState({ tab: t[0], playing: t[0] === 'sim' ? this.state.playing : false, hover: null, h: null, lHov: null }); }
    }));
    return Object.assign(
      { asOfLabel: (window.TAUX_DATA.meta && window.TAUX_DATA.meta.asOfLabel) || '', tabs: tabs, isSim: st.tab === 'sim', isLoan: st.tab === 'loan', isHist: st.tab === 'hist', isDyn: st.tab === 'dyn', isSrc: st.tab === 'src' },
      this.simVals(), this.histVals(), this.dynVals(), { loan: this.loanVals() }
    );
  }

  // ---------- Simulation d'emprunt ----------
  niceStep(raw) {
    if (!(raw > 0)) return 1;
    const pw = Math.pow(10, Math.floor(Math.log10(raw)));
    const m = raw / pw;
    return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * pw;
  }
  loanCurve(i, useShock) {
    const d = this.D();
    const sh = t => (useShock ? this.shockBp('sweur', t, i) / 100 : 0);
    const P = [[0.25, d.e3m[i]], [0.5, d.e6m[i]], [1, d.e12m[i]], [2, d.swe[i][0]], [5, d.swe[i][1]], [10, d.swe[i][2]], [30, d.swe[i][3]]].map(q => [q[0], q[1] + sh(q[0])]);
    const par = T => {
      if (T <= P[0][0]) return P[0][1];
      for (let k = 1; k < P.length; k++) if (T <= P[k][0]) { const a = P[k - 1], b = P[k]; return a[1] + (b[1] - a[1]) * (T - a[0]) / (b[0] - a[0]); }
      return P[P.length - 1][1];
    };
    const df = [1];
    let sum = 0;
    for (let n = 1; n <= 30; n++) { const s = par(n) / 100; const v = (1 - s * sum) / (1 + s); df.push(v); sum += v; }
    const fwd = n => { const k = Math.max(1, Math.min(30, n)); return (df[k - 1] / df[k] - 1) * 100; };
    return { par: par, fwd: fwd, e3m: P[0][1] };
  }
  loanSched(o) {
    const N = Math.max(1, Math.round(o.years * o.freq));
    const G = o.prof === 'inf' ? 0 : Math.min(o.grace * o.freq, N - 1);
    let crd = o.amt;
    const rows = [];
    for (let p = 0; p < N; p++) {
      const t0 = p / o.freq, rA = o.rate(p, t0), r = rA / 100 / o.freq;
      const it = crd * r;
      let cap;
      if (o.prof === 'inf') cap = p === N - 1 ? crd : 0;
      else if (p < G) cap = 0;
      else if (o.prof === 'lin') cap = o.amt / (N - G);
      else { const rem = N - p; const pay = Math.abs(r) > 1e-12 ? crd * r / (1 - Math.pow(1 + r, -rem)) : crd / rem; cap = pay - it; }
      if (p === N - 1) cap = crd;
      rows.push({ p: p, t0: t0, t1: (p + 1) / o.freq, crd0: crd, it: it, cap: cap, rA: rA });
      crd -= cap;
    }
    return rows;
  }
  loanFixed(cv, b) {
    let r = cv.par(b.years) + b.marge / 100, rows, wal = b.years;
    for (let k = 0; k < 3; k++) {
      rows = this.loanSched(Object.assign({}, b, { rate: () => r }));
      wal = rows.reduce((s, q) => s + q.cap * q.t1, 0) / b.amt;
      r = cv.par(wal) + b.marge / 100;
    }
    rows = this.loanSched(Object.assign({}, b, { rate: () => r }));
    return { r: r, swap: r - b.marge / 100, wal: wal, rows: rows };
  }
  loanVar(cv, b, mode, shift) {
    const s = (shift || 0) / 100;
    const base = (p, t0) => (mode === 'flat' || p === 0 ? cv.e3m : cv.fwd(Math.floor(t0 + 1e-9) + 1)) + s;
    const rows = this.loanSched(Object.assign({}, b, { rate: (p, t0) => base(p, t0) + b.marge / 100 }));
    rows.forEach(q => { q.base = q.rA - b.marge / 100; });
    return { rows: rows };
  }
  loanIrr(rows, amt, fee, freq) {
    const net = amt * (1 - fee / 10000);
    const f = x => { let v = 0; rows.forEach((q, k) => { v += (q.it + q.cap) / Math.pow(1 + x, k + 1); }); return v - net; };
    let lo = -0.5 / freq, hi = 1;
    for (let k = 0; k < 80; k++) { const m = (lo + hi) / 2; if (f(m) > 0) lo = m; else hi = m; }
    return (Math.pow(1 + (lo + hi) / 2, freq) - 1) * 100;
  }
  loanYears(rows, freq, years) {
    const Y = [];
    for (let y = 0; y < years; y++) Y.push({ y: y + 1, crd0: null, it: 0, cap: 0, crd1: 0, rSum: 0, n: 0 });
    rows.forEach(q => { const o = Y[Math.min(years - 1, Math.floor(q.p / freq))]; if (o.crd0 == null) o.crd0 = q.crd0; o.it += q.it; o.cap += q.cap; o.crd1 = q.crd0 - q.cap; o.rSum += q.rA; o.n++; });
    Y.forEach(o => { o.pay = o.it + o.cap; o.rAvg = o.n ? o.rSum / o.n : 0; if (o.crd0 == null) o.crd0 = 0; if (Math.abs(o.crd1) < 1e-9) o.crd1 = 0; });
    return Y;
  }

  loanVals() {
    const d = this.D();
    const st = this.state;
    const i = st.di;
    const cur = st.lCur;
    const FX = 119.33174;
    const NAVY = '#062f59', TERRA = '#b05a2e';
    const money = vM => {
      if (cur === 'EUR') return Math.abs(vM) >= 1 ? vM.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' M€' : Math.round(vM * 1000).toLocaleString('fr-FR') + ' k€';
      const x = vM * FX;
      return x.toLocaleString('fr-FR', { maximumFractionDigits: Math.abs(x) >= 100 ? 0 : 1 }) + ' M XPF';
    };
    const disp = vM => (cur === 'EUR' ? vM * 1000 : vM * FX);
    const tv = vM => (cur === 'EUR' ? Math.round(vM * 1000).toLocaleString('fr-FR') : (vM * FX).toLocaleString('fr-FR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }));
    const unit = cur === 'EUR' ? 'k€' : 'M XPF';
    const shockSet = this.shockOn();
    const useShock = st.lShock && shockSet;
    const cv = this.loanCurve(i, useShock);
    const b = { amt: st.lAmt, years: st.lYears, freq: st.lFreq, prof: st.lProf, grace: st.lGrace, marge: st.lMarge };
    const m = b.marge / 100;
    const sumI = rows => rows.reduce((s, q) => s + q.it, 0);
    const avgRate = rows => { let a = 0, w = 0; rows.forEach(q => { a += q.it; w += q.crd0 / b.freq; }); return w > 0 ? a / w * 100 : 0; };
    const yrs = v => v.toFixed(1).replace('.', ',') + (v < 2 ? ' an' : ' ans');

    const PROF = [['lin', 'Amortissement constant'], ['ann', 'Échéances constantes'], ['inf', 'In fine']];
    const prof = PROF.map(pf => {
      const bb = Object.assign({}, b, { prof: pf[0] });
      const f = this.loanFixed(cv, bb);
      const v = this.loanVar(cv, bb, st.lProj, 0);
      return { k: pf[0], name: pf[1], fx: f, vr: v, intF: sumI(f.rows), intV: sumI(v.rows) };
    });
    const sel = prof.find(x => x.k === b.prof);
    const fx = sel.fx, vr = sel.vr, intFix = sel.intF, intVar = sel.intV;
    const varAvg = avgRate(vr.rows);
    const irr = this.loanIrr(fx.rows, b.amt, st.lFee, b.freq);
    const viewVar = st.lView === 'var';
    const Yr = this.loanYears(viewVar ? vr.rows : fx.rows, b.freq, b.years);
    const YrFix = this.loanYears(fx.rows, b.freq, b.years);
    let maxPay = 0, maxY = 1;
    YrFix.forEach(o => { if (o.pay > maxPay + 1e-12) { maxPay = o.pay; maxY = o.y; } });

    const g = s => sumI(this.loanVar(cv, b, st.lProj, s).rows) - intFix;
    let beTxt, beDetail;
    if (g(-500) > 0) { beTxt = '< −500 pb'; beDetail = 'Le variable reste plus cher que le fixe même avec une forte baisse des taux.'; }
    else if (g(500) < 0) { beTxt = '> +500 pb'; beDetail = 'Le variable reste moins cher que le fixe même avec une forte hausse des taux.'; }
    else {
      let lo = -500, hi = 500;
      for (let k = 0; k < 40; k++) { const mid = (lo + hi) / 2; if (g(mid) > 0) hi = mid; else lo = mid; }
      const be = (lo + hi) / 2;
      beTxt = this.bp(be);
      beDetail = be >= 0 ? 'Le variable coûte moins que le fixe tant que les taux à terme ne montent pas de plus de ' + Math.round(be) + ' pb en moyenne.' : 'Le variable ne devient moins cher que si les taux baissent de plus de ' + Math.round(-be) + ' pb par rapport aux anticipations.';
    }
    const diff = intVar - intFix;
    const kp = (label, val, detail, primary) => ({ label: label, val: val, detail: detail, bg: primary ? NAVY : '#fbf9f5', labC: primary ? '#9db6d2' : '#66707f', valC: primary ? '#ffffff' : NAVY, detC: primary ? '#e9a47c' : '#66707f' });
    const kpis = [
      kp('Taux fixe tout compris', this.pct(fx.r), 'Swap ' + this.f2(fx.swap) + ' % à ' + yrs(fx.wal) + ' (durée de vie moyenne) + ' + b.marge + ' pb', true),
      kp('Taux variable, 1re période', this.pct(cv.e3m + m), 'Moyenne projetée : ' + this.pct(varAvg) + (st.lProj === 'flat' ? ' (Euribor constant)' : ' (taux à terme implicites)'), false),
      kp('Intérêts totaux, fixe', money(intFix), 'Variable projeté : ' + money(intVar) + ' (' + (diff >= 0 ? '+' : '−') + money(Math.abs(diff)) + ')', false),
      kp('Coût actuariel (fixe)', this.pct(irr), 'Taux annuel effectif, commission de ' + st.lFee + ' pb et capitalisation ' + (b.freq === 12 ? 'mensuelle' : b.freq === 4 ? 'trimestrielle' : b.freq === 2 ? 'semestrielle' : 'annuelle') + ' incluses', false),
      kp('Annuité maximale (fixe)', money(maxPay), 'Année ' + maxY + ' ; total des échéances : ' + money(intFix + b.amt), false),
      kp('Point mort du variable', beTxt, beDetail, false)
    ];

    // Échéancier annuel
    const n = b.years;
    const A = { X0: 64, X1: 588, Y0: 14, Y1: 244 };
    const slot = (A.X1 - A.X0) / n, bw = Math.max(3, slot * 0.66);
    const maxD = Math.max.apply(null, Yr.map(o => disp(o.pay)));
    const stpA = this.niceStep(maxD / 4);
    const topA = Math.max(stpA, Math.ceil(maxD / stpA) * stpA);
    const yA = v => A.Y1 - v / topA * (A.Y1 - A.Y0);
    let capD = '', intD = '', gridA = '';
    const yTicksA = [];
    for (let v = 0; v <= topA + 1e-9; v += stpA) { gridA += 'M' + A.X0 + ' ' + yA(v).toFixed(1) + ' H' + A.X1 + ' '; yTicksA.push({ top: (yA(v) / 2.8).toFixed(2) + '%', txt: v.toLocaleString('fr-FR', { maximumFractionDigits: stpA < 1 ? 1 : 0 }) }); }
    Yr.forEach((o, k) => {
      const x = A.X0 + slot * k + (slot - bw) / 2;
      const yc = yA(disp(o.cap)), yt = yA(disp(o.pay));
      if (A.Y1 - yc > 0.5) capD += 'M' + x.toFixed(1) + ' ' + yc.toFixed(1) + ' h' + bw.toFixed(1) + ' V' + A.Y1 + ' h' + (-bw).toFixed(1) + ' Z ';
      const ib = A.Y1 - yc > 0.5 ? yc - 2 : A.Y1;
      if (ib - yt > 0.5) intD += 'M' + x.toFixed(1) + ' ' + yt.toFixed(1) + ' h' + bw.toFixed(1) + ' V' + ib.toFixed(1) + ' h' + (-bw).toFixed(1) + ' Z ';
    });
    const every = n <= 12 ? 1 : n <= 20 ? 2 : 5;
    const xTicksA = Yr.filter((o, k) => k === 0 || (k + 1) % every === 0).map(o => ({ left: ((A.X0 + slot * (o.y - 1) + slot / 2) / 6).toFixed(2) + '%', txt: String(o.y) }));
    let hovD = '', readA;
    const hk = st.lHov != null && st.lHov < n ? st.lHov : null;
    if (hk != null) {
      const o = Yr[hk];
      const x = A.X0 + slot * hk + (slot - bw) / 2 - 3;
      hovD = 'M' + x.toFixed(1) + ' ' + (yA(disp(o.pay)) - 4).toFixed(1) + ' h' + (bw + 6).toFixed(1) + ' V' + A.Y1 + ' h' + (-(bw + 6)).toFixed(1) + ' Z';
      readA = 'Année ' + o.y + ' : capital ' + tv(o.cap) + ' · intérêts ' + tv(o.it) + ' · échéances ' + tv(o.pay) + ' · capital restant ' + tv(o.crd1) + ' ' + unit + ' · taux ' + this.f2(o.rAvg) + ' %';
    } else {
      const ti = Yr.reduce((s, o) => s + o.it, 0);
      readA = 'Total sur ' + n + (n > 1 ? ' ans' : ' an') + ' : capital ' + tv(b.amt) + ' · intérêts ' + tv(ti) + ' · échéances ' + tv(b.amt + ti) + ' ' + unit;
    }
    const a = {
      grid: gridA, cap: capD, int: intD, hov: hovD, yTicks: yTicksA, xTicks: xTicksA, read: readA,
      intColor: viewVar ? TERRA : NAVY, viewName: viewVar ? 'taux variable projeté' : 'taux fixe',
      aria: 'Échéancier annuel : ' + Yr.map(o => 'année ' + o.y + ' ' + tv(o.pay) + ' ' + unit).join(', '),
      onMove: e => {
        const r = e.currentTarget.getBoundingClientRect();
        if (!r.width) return;
        const vx = (e.clientX - r.left) / r.width * 600;
        const k = Math.max(0, Math.min(n - 1, Math.floor((vx - A.X0) / slot)));
        if (k !== this.state.lHov) this.setState({ lHov: k });
      },
      onLeave: () => { if (this.state.lHov != null) this.setState({ lHov: null }); }
    };

    // Capital restant dû
    const B = { X0: 56, X1: 584, Y0: 12, Y1: 212 };
    const xB = t => B.X0 + (B.X1 - B.X0) * t / n;
    const yB = v => B.Y1 - v / b.amt * (B.Y1 - B.Y0);
    let gridB = '';
    const yTicksB = [0, 0.25, 0.5, 0.75, 1].map(f => { gridB += 'M' + B.X0 + ' ' + yB(f * b.amt).toFixed(1) + ' H' + B.X1 + ' '; return { top: (yB(f * b.amt) / 2.4).toFixed(2) + '%', txt: Math.round(disp(f * b.amt)).toLocaleString('fr-FR') }; });
    const xTicksB = [];
    for (let y = 0; y <= n; y += (n <= 12 ? 1 : n <= 20 ? 2 : 5)) xTicksB.push({ left: (xB(y) / 6).toFixed(2) + '%', txt: String(y) });
    const bs = prof.map(pf => {
      const on = pf.k === b.prof;
      let dPath = 'M' + xB(0).toFixed(1) + ' ' + yB(b.amt).toFixed(1);
      pf.fx.rows.forEach(q => { dPath += ' L' + xB(q.t1).toFixed(1) + ' ' + yB(Math.max(0, q.crd0 - q.cap)).toFixed(1); });
      return { d: dPath, color: on ? NAVY : '#8a93a1', w: on ? '2.5' : '1.75', dash: on ? 'none' : '5 4' };
    });
    const bChart = {
      grid: gridB, s0: bs[0], s1: bs[1], s2: bs[2], yTicks: yTicksB, xTicks: xTicksB,
      legend: prof.map((pf, k) => ({ name: pf.name + ' · DVM ' + yrs(pf.fx.wal), color: bs[k].color, w: bs[k].w, dash: bs[k].dash, fw: pf.k === b.prof ? '700' : '400', tc: pf.k === b.prof ? NAVY : '#66707f' })),
      aria: 'Capital restant dû : ' + prof.map(pf => pf.name + ', durée de vie moyenne ' + yrs(pf.fx.wal)).join(' ; '),
      note: 'Capital en ' + unit + ', années en abscisse. Plus le capital reste dû longtemps, plus la durée de vie moyenne et les intérêts augmentent.' + (b.grace > 0 && b.prof !== 'inf' ? ' Différé de ' + b.grace + ' an' + (b.grace > 1 ? 's' : '') + ' inclus.' : '')
    };

    // Taux payés
    const R = { X0: 56, X1: 584, Y0: 12, Y1: 212 };
    const rv = [fx.r];
    vr.rows.forEach(q => { rv.push(q.rA, q.base); });
    const rmn = Math.min.apply(null, rv), rmx = Math.max.apply(null, rv);
    const rst = rmx - rmn > 1.5 ? 0.5 : 0.25;
    const r0 = Math.floor((rmn - 0.1) / rst) * rst, r1 = Math.ceil((rmx + 0.1) / rst) * rst;
    const xR = t => R.X0 + (R.X1 - R.X0) * t / n;
    const yR = v => R.Y1 - (v - r0) / (r1 - r0) * (R.Y1 - R.Y0);
    let gridR = '';
    const yTicksR = [];
    for (let v = r0; v <= r1 + 1e-9; v += rst) { gridR += 'M' + R.X0 + ' ' + yR(v).toFixed(1) + ' H' + R.X1 + ' '; yTicksR.push({ top: (yR(v) / 2.4).toFixed(2) + '%', txt: v.toFixed(2).replace('.', ',') }); }
    const stepPath = key => { let s = ''; vr.rows.forEach((q, k) => { s += (k === 0 ? 'M' + xR(0).toFixed(1) + ' ' : ' V') + yR(q[key]).toFixed(1) + ' H' + xR(q.t1).toFixed(1); }); return s; };
    const ddChart = {
      grid: gridR, fix: 'M' + R.X0 + ' ' + yR(fx.r).toFixed(1) + ' H' + R.X1, var: stepPath('rA'), base: stepPath('base'),
      yTicks: yTicksR, xTicks: xTicksB.map(t => ({ left: t.left, txt: t.txt })),
      legend: [
        { name: 'Fixe', color: NAVY, w: '2.5', dash: 'none', val: this.pct(fx.r) },
        { name: 'Variable, moyenne', color: TERRA, w: '2.5', dash: 'none', val: this.pct(varAvg) },
        { name: 'Euribor projeté hors marge, moyenne', color: '#e9a47c', w: '1.75', dash: '4 4', val: this.pct(varAvg - m) }
      ],
      aria: 'Taux fixe ' + this.pct(fx.r) + ', taux variable moyen projeté ' + this.pct(varAvg),
      note: st.lProj === 'flat' ? 'Hypothèse Euribor constant : le variable reste au niveau actuel sur toute la durée, sans tenir compte des hausses intégrées par le marché.' : 'Le variable suit les taux à terme implicites : la courbe intègre déjà les hausses anticipées. Sans surprise de taux, fixe et variable coûtent à peu près la même chose.'
    };

    // Intérêts par profil
    const cmax = Math.max.apply(null, prof.map(pf => Math.max(pf.intF, pf.intV))) || 1;
    const cChart = { rows: prof.map(pf => ({ name: pf.name, wal: 'DVM ' + yrs(pf.fx.wal) + ', fixe ' + this.pct(pf.fx.r), wf: (pf.intF / cmax * 78).toFixed(1) + '%', wv: (pf.intV / cmax * 78).toFixed(1) + '%', tf: money(pf.intF), tv: money(pf.intV), bg: pf.k === b.prof ? '#f4f1ea' : 'transparent', bl: pf.k === b.prof ? TERRA : 'transparent' })) };

    // Sensibilité
    const SH = [-100, -50, 0, 50, 100];
    const sens = SH.map(s => ({ s: s, v: s === 0 ? intVar : sumI(this.loanVar(cv, b, st.lProj, s).rows) }));
    const emax = Math.max(intFix, Math.max.apply(null, sens.map(x => x.v))) * 1.15;
    const cheaper = sens.filter(x => x.v < intFix).map(x => x.s);
    const eChart = {
      bars: sens.map(x => ({ lab: x.s === 0 ? 'Base' : this.bp(x.s), h: (x.v / emax * 100).toFixed(1) + '%', val: money(x.v), bg: x.s === 0 ? TERRA : '#e9a47c' })),
      refBottom: (intFix / emax * 100).toFixed(1) + '%',
      note: 'Fixe : ' + money(intFix) + '. ' + (cheaper.length === 0 ? 'Dans aucun des cas testés le variable n\'est moins cher.' : cheaper.length === SH.length ? 'Le variable est moins cher dans tous les cas testés.' : 'Le variable est moins cher dans ces cas : ' + cheaper.map(s => (s === 0 ? 'sans choc' : this.bp(s))).join(', ') + '.')
    };

    // Tableau
    const tbl = Yr.map(o => ({ y: String(o.y), c0: tv(o.crd0), it: tv(o.it), cap: tv(o.cap), pay: tv(o.pay), c1: tv(Math.max(0, o.crd1)), r: this.f2(o.rAvg) + ' %', fw: '400' }));
    const ti = Yr.reduce((s, o) => s + o.it, 0);
    tbl.push({ y: 'Total', c0: '', it: tv(ti), cap: tv(b.amt), pay: tv(ti + b.amt), c1: '', r: this.pct(avgRate(viewVar ? vr.rows : fx.rows)), fw: '700' });

    // Contrôles
    const ch = on => this.chip(on);
    const curBtns = [['EUR', 'EUR'], ['XPF', 'XPF']].map(c => Object.assign({ label: c[1], on: cur === c[0], pick: () => this.setState({ lCur: c[0] }) }, ch(cur === c[0])));
    const amt = cur === 'EUR'
      ? { min: 1, max: 100, step: 0.5, value: st.lAmt, txt: money(b.amt), help: '≈ ' + (b.amt * FX).toLocaleString('fr-FR', { maximumFractionDigits: 0 }) + ' M XPF', onChange: e => this.setState({ lAmt: Number(e.target.value) }) }
      : { min: 100, max: 12000, step: 50, value: Math.round(st.lAmt * FX / 50) * 50, txt: (Math.round(st.lAmt * FX / 50) * 50).toLocaleString('fr-FR') + ' M XPF', help: '≈ ' + b.amt.toLocaleString('fr-FR', { maximumFractionDigits: 2 }) + ' M€ (parité fixe)', onChange: e => this.setState({ lAmt: Number(e.target.value) / FX }) };
    const profBtns = PROF.map(pf => Object.assign({ label: pf[1], on: b.prof === pf[0], pick: () => this.setState({ lProf: pf[0], lHov: null }) }, ch(b.prof === pf[0])));
    const gBtns = [0, 1, 2, 3].map(gv => Object.assign({ label: gv === 0 ? 'Aucun' : gv + ' an' + (gv > 1 ? 's' : ''), on: st.lGrace === gv, pick: () => this.setState({ lGrace: gv }) }, ch(st.lGrace === gv)));
    const fBtns = [[12, 'Mensuelle'], [4, 'Trimestrielle'], [2, 'Semestrielle'], [1, 'Annuelle']].map(f => Object.assign({ label: f[1], on: b.freq === f[0], pick: () => this.setState({ lFreq: f[0] }) }, ch(b.freq === f[0])));
    const pBtns = [['fwd', 'Taux à terme implicites'], ['flat', 'Euribor constant']].map(p => Object.assign({ label: p[1], on: st.lProj === p[0], pick: () => this.setState({ lProj: p[0] }) }, ch(st.lProj === p[0])));
    const viewBtns = [['fix', 'Taux fixe'], ['var', 'Taux variable']].map(v => Object.assign({ label: v[1], on: st.lView === v[0], pick: () => this.setState({ lView: v[0] }) }, ch(st.lView === v[0])));
    const shock = Object.assign({
      on: !!st.lShock,
      label: st.lShock ? 'Scénario du simulateur appliqué (retirer)' : 'Appliquer le scénario de choc du simulateur',
      note: !st.lShock ? 'La courbe EUR est utilisée telle qu\'observée.' : shockSet ? 'Courbe EUR déformée par le choc réglé dans l\'onglet Simulateur (taux directeur ' + this.bp(st.P) + ', niveau ' + this.bp(st.L) + ', pente ' + this.bp(st.S) + ', courbure ' + this.bp(st.C) + ').' + (st.zone === 'usd' ? ' Zone réglée sur États-Unis : sans effet sur la courbe EUR.' : '') : 'Aucun choc n\'est réglé dans l\'onglet Simulateur : sans effet.',
      toggle: () => this.setState({ lShock: !this.state.lShock })
    }, ch(!!st.lShock));

    return {
      dateLong: d.long[i] + (useShock ? ', scénario de choc appliqué' : ''),
      date: { value: i, txt: d.long[i], onChange: e => { this.stopPlay(); this.setState({ di: Number(e.target.value), playing: false }); } },
      curBtns: curBtns, amt: amt,
      years: { value: b.years, txt: b.years + ' an' + (b.years > 1 ? 's' : ''), onChange: e => this.setState({ lYears: Number(e.target.value), lHov: null }) },
      marge: { value: b.marge, txt: b.marge + ' pb', onChange: e => this.setState({ lMarge: Number(e.target.value) }) },
      fee: { value: st.lFee, txt: st.lFee + ' pb (' + money(b.amt * st.lFee / 10000) + ')', onChange: e => this.setState({ lFee: Number(e.target.value) }) },
      profBtns: profBtns, gBtns: gBtns, fBtns: fBtns, pBtns: pBtns, viewBtns: viewBtns,
      gOpacity: b.prof === 'inf' ? '0.5' : '1',
      gNote: b.prof === 'inf' ? 'Sans objet pour un prêt in fine.' : 'Intérêts seuls pendant le différé.',
      shock: shock, kpis: kpis, unit: unit,
      a: a, b: bChart, dd: ddChart, c: cChart, e: eChart, tbl: tbl
    };
  }
}
</script>
<script>
DCRuntime.mount(Component, document.getElementById('app'), document.getElementById('tpl'));
</script>
</body>
